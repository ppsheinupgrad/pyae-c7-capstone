---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Name }}
  name: {{ .Values.redis.name }}
  namespace: {{ .Values.namespace }}
spec:
  serviceName: redis
  {{- include "cachereplica" . | nindent 2 }}
  selector:
    matchLabels:
      app: {{ .Values.redis.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.redis.name }}
    spec:
    spec:
      initContainers:
      - name: config
        image:  {{ .Values.redis.image }}
        command: [ "sh", "-c" ]
        args:
          - |
            echo "finding master..."
            MASTER_FDQN=`hostname  -f | sed -e 's/redis-[0-9]\./redis-0./'`
            if [ "$(redis-cli -h sentinel -p 5000 ping)" != "PONG" ]; then
              echo "master not found, defaulting to redis-0"
              if [ "$(hostname)" == "redis-0" ]; then
                echo "this is redis-0, not updating config..."
              else
                echo "updating redis.conf..."
                echo "slaveof $MASTER_FDQN 6379" >> /var/lib/redis/redis.conf
              fi
            else
              echo "sentinel found, finding master"
              MASTER="$(redis-cli -h sentinel -p 5000 sentinel get-master-addr-by-name mymaster | grep -E '(^redis-\d{1,})|([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})')"
              echo "master found : $MASTER, updating redis.conf"
              echo "slaveof $MASTER 6379" >> /var/lib/redis/redis.conf
            fi
        volumeMounts:
        - name: redis-config
          mountPath: /var/lib/redis/
        - name: config
          mountPath: /tmp/redis/
      containers:
      - name: {{ .Values.redis.name }}
        image: {{ .Values.redis.image }}
        command: ["redis-server"]
        resources:
          limits:
            cpu: 200m
            memory: 200Mi
        args: ["/var/lib/redis/redis.conf"]
        ports:
        - containerPort: {{ .Values.redis.port }}
          name: redis
        volumeMounts:
        - name: data
          mountPath: /data
        - name: redis-config
          mountPath: /var/lib/redis/
      volumes:
      - name: redis-config
        emptyDir: {}
      - name: config
        configMap:
          name: redis-{{ .Release.Name }}-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.redis.storageClassName }}
      resources:
        requests:
          storage: 500Mi